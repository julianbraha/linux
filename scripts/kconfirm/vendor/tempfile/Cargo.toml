[dependencies.fastrand]
version = "2.1.1"

[dependencies.once_cell]
default-features = false
features = ["std"]
version = "1.19.0"

[dev-dependencies.doc-comment]
version = "0.3"

[features]
default = ["getrandom"]
nightly = []

[lib]
name = "tempfile"
path = "src/lib.rs"

[package]
authors = ["Steven Allen <steven@stebalien.com>", "The Rust Project Developers", "Ashley Mannix <ashleymannix@live.com.au>", "Jason White <me@jasonwhite.io>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
description = "A library for managing temporary files and directories."
documentation = "https://docs.rs/tempfile"
edition = "2021"
homepage = "https://stebalien.com/projects/tempfile-rs/"
include = ["CHANGELOG.md", "Cargo.toml", "LICENSE-*", "README.md", "src/**/*.rs", "tests/**/*.rs"]
keywords = ["tempfile", "tmpfile", "filesystem"]
license = "MIT OR Apache-2.0"
name = "tempfile"
readme = "README.md"
repository = "https://github.com/Stebalien/tempfile"
rust-version = "1.63"
version = "3.27.0"

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]

[target.'cfg(any(unix, target_os = "wasi"))'.dependencies.rustix]
features = ["fs"]
version = "1.1.4"

[target.'cfg(any(unix, windows, target_os = "wasi"))'.dependencies.getrandom]
default-features = false
optional = true
version = ">=0.3.0, <0.5"

[target."cfg(windows)".dependencies.windows-sys]
features = ["Win32_Storage_FileSystem", "Win32_Foundation"]
version = ">=0.52, <0.62"
