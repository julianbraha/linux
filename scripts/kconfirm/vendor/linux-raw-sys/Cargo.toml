[dependencies.core]
optional = true
package = "rustc-std-workspace-core"
version = "1.0.0"

[dev-dependencies.libc]
version = "0.2.100"

[dev-dependencies.static_assertions]
version = "1.1.0"

[features]
auxvec = []
bootparam = []
btrfs = []
default = ["std", "general", "errno"]
elf = []
elf_uapi = []
errno = []
general = []
if_arp = []
if_ether = []
if_packet = []
if_tun = []
image = []
io_uring = []
ioctl = []
landlock = []
loop_device = []
mempolicy = []
net = []
netlink = []
no_std = []
prctl = []
ptrace = []
rustc-dep-of-std = ["core", "no_std"]
std = []
system = []
vm_sockets = []
xdp = []

[lib]
name = "linux_raw_sys"
path = "src/lib.rs"

[lints.rust.unexpected_cfgs]
check-cfg = ['cfg(target_arch, values("xtensa"))']
level = "warn"
priority = 0

[package]
authors = ["Dan Gohman <dev@sunfishcode.online>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["external-ffi-bindings"]
description = "Generated bindings for Linux's userspace API"
documentation = "https://docs.rs/linux-raw-sys"
edition = "2021"
exclude = ["/gen", "/.*"]
keywords = ["linux", "uapi", "ffi"]
license = "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT"
name = "linux-raw-sys"
readme = "README.md"
repository = "https://github.com/sunfishcode/linux-raw-sys"
rust-version = "1.63"
version = "0.12.1"

[package.metadata.docs.rs]
features = ["default", "bootparam", "btrfs", "elf_uapi", "image", "ioctl", "landlock", "netlink", "io_uring", "if_arp", "if_ether", "if_packet", "net", "ptrace", "prctl", "elf", "xdp", "mempolicy", "system", "loop_device"]
targets = ["x86_64-unknown-linux-gnu", "i686-unknown-linux-gnu"]
