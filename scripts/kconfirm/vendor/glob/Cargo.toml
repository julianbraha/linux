[dev-dependencies.doc-comment]
version = "0.3"

[dev-dependencies.tempdir]
version = "0.3"

[lib]
name = "glob"
path = "src/lib.rs"

[package]
authors = ["The Rust Project Developers"]
autobenches = false
autobins = false
