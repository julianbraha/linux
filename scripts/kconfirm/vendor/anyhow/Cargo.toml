[dev-dependencies.futures]
default-features = false
version = "0.3"

[dev-dependencies.rustversion]
version = "1.0.6"

[dev-dependencies.syn]
features = ["full"]
version = "2.0"

[dev-dependencies.thiserror]
version = "2"

[dev-dependencies.trybuild]
features = ["diff"]
version = "1.0.108"

[features]
backtrace = []
default = ["std"]
std = []

[lib]
name = "anyhow"
path = "src/lib.rs"

[package]
authors = ["David Tolnay <dtolnay@gmail.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["rust-patterns", "no-std"]
description = "Flexible concrete Error type built on std::error::Error"
documentation = "https://docs.rs/anyhow"
edition = "2021"
keywords = ["error", "error-handling"]
license = "MIT OR Apache-2.0"
name = "anyhow"
readme = "README.md"
repository = "https://github.com/dtolnay/anyhow"
rust-version = "1.68"
version = "1.0.102"

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition", "--generate-macro-expansion", "--extern-html-root-url=core=https://doc.rust-lang.org", "--extern-html-root-url=alloc=https://doc.rust-lang.org", "--extern-html-root-url=std=https://doc.rust-lang.org"]
targets = ["x86_64-unknown-linux-gnu"]
