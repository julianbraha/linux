[features]
default = ["std"]
std = ["libc/std"]

[lib]
name = "errno"
path = "src/lib.rs"

[lints.rust.unexpected_cfgs]
check-cfg = ['cfg(target_os, values("cygwin"))']
level = "warn"
priority = 0

[package]
authors = ["Chris Wong <lambda.fairy@gmail.com>", "Dan Gohman <dev@sunfishcode.online>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["no-std", "os"]
description = "Cross-platform interface to the `errno` variable."
documentation = "https://docs.rs/errno"
edition = "2018"
license = "MIT OR Apache-2.0"
name = "errno"
readme = "README.md"
repository = "https://github.com/lambda-fairy/rust-errno"
rust-version = "1.56"
version = "0.3.14"

[target.'cfg(target_os="hermit")'.dependencies.libc]
default-features = false
version = "0.2"

[target.'cfg(target_os="wasi")'.dependencies.libc]
default-features = false
version = "0.2"

[target."cfg(unix)".dependencies.libc]
default-features = false
version = "0.2"

[target."cfg(windows)".dependencies.windows-sys]
features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug"]
version = ">=0.52, <0.62"
